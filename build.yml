plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.screentap'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.screentap"
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}
